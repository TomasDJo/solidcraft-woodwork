[package]
name = "woodwork"
version = "0.4.0"
license = "MIT"
edition = "2021"
description = "Woodworking plugin for SolidCraft: cabinets and cut lists"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
