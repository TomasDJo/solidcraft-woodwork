# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  poem: false
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  auto_review:
    # Review when a PR is opened or marked ready, or on `@coderabbitai review`; not on every push.
    drafts: false
    auto_incremental_review: false
    # Dependabot bumps are checked by CI.
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    - path: "src/**"
      instructions: |
        Every fix and every function has a test that fails without it: a unit test in the module's tests.rs, and a case in tests/ when it shows in real geometry. Flag a change without one.
        Every length sent to the app carries its unit ("582 mm"); a bare number is read in the design's unit. Only occurrence.move's translate and a joint's point take plain mm.
        Design-wide settings (joinery, hardware, thickness, reveal, the plinth's height and set-back) stay out of Edit, which changes only what is per cabinet.
        Apply settings never overwrites a value chosen per cabinet; it follows a setting only where the cabinet took the default.
        No unwrap, expect or panic in plugin code that user input or an app reply can reach: return an Err with a message the user can act on.
    - path: "Cargo.toml"
      instructions: |
        No new dependencies beyond serde_json and wit-bindgen: the plugin is one small WebAssembly component.
    - path: "{src/**,plugin.json}"
      instructions: |
        A change a user can see updates docs/usage.md in the same PR, and README.md's short list when a function is added. Flag it when the docs are missing.
    - path: "{plugin.json,docs/**,README.md}"
      instructions: |
        Help links work: every `x-solidcraft-help` link in plugin.json points to an existing page and heading anchor in docs/usage.md or README.md. A renamed or removed heading updates the links that point to it.
  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
    custom_checks:
      - name: Docs updated
        mode: warning
        instructions: |
          Pass when the PR changes nothing a user sees or does. Otherwise, a change to plugin.json or src/ that changes what a user sees or does (a field, a choice, a default, what a function builds or refuses) must also update docs/usage.md in the same PR, and README.md when a function is added. Fail and name the change that is not documented.
      - name: Test for the change
        mode: warning
        instructions: |
          Pass when the PR changes no behaviour (docs, CI or config only). Otherwise, a fix or new behaviour must add or change a test, a unit test in src/**/tests.rs or an end-to-end test in tests/test_*.py, that would fail without the change. Fail and name the fix or behaviour that has no such test.
      - name: Fulfils the linked issue
        mode: warning
        instructions: |
          Pass when the PR has no linked issue (a line "No issue: <reason>"). Otherwise, the PR must do what its "Closes #N" or "Fixes #N" issue asks, or say in its description what is left for later. Fail and name what the issue asks that the PR neither does nor mentions.
      - name: Help links work
        mode: warning
        instructions: |
          Pass when plugin.json has no `x-solidcraft-help` links and the PR renames or removes no heading in docs/usage.md or README.md. Otherwise, every `x-solidcraft-help` link in plugin.json must point to an existing file and heading anchor in docs/usage.md or README.md as they are after this PR (GitHub's anchors: lowercase, spaces to hyphens, punctuation removed). Fail and name each broken link.
