name: Feature
description: Something Woodwork should build or do.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to make
      description: The piece of furniture or the step, in plain words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, if there is one.
  - type: textarea
    id: picture
    attributes:
      label: Picture or sketch
      description: Optional, but it helps a lot.
