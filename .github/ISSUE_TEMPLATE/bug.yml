name: Bug
description: Something Woodwork builds or does wrong.
labels: [bug]
body:
  - type: input
    id: solidcraft
    attributes:
      label: SolidCraft version
      description: Help > About, or `solidcraft-cli --version`.
      placeholder: "0.50.0"
    validations:
      required: true
  - type: input
    id: woodwork
    attributes:
      label: Woodwork version
      description: Plugins > Manage plugins, or the zip's name.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step, with the dialog values you changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, with any message shown.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Paste a picture of the dialog or the model. A design file (.sc) helps too.
