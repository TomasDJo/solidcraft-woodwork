name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checks:
    # Dependabot's bumps have no issue to link; a skipped required check counts as passed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Base, issue link and picture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(jq -r .pull_request.base.ref "$GITHUB_EVENT_PATH")
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          # A release PR's head is this repository's develop, not a fork's branch of that name.
          head=$(jq -r 'if .pull_request.head.repo.full_name == .repository.full_name then .pull_request.head.ref else "fork" end' "$GITHUB_EVENT_PATH")
          number=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
          fail=0
          # Work goes into develop; main only takes develop, at a release.
          case "$base:$head" in
            develop:* | main:develop) ;;
            *)
              echo "::error::A pull request goes into develop (this one is into '$base'): one PR a feature or fix, no stacked chains. main only takes develop at a release."
              fail=1 ;;
          esac
          if ! grep -Eiq '(closes|fixes|part of|refs) #[0-9]+|^no issue: .+' <<<"$body"; then
            echo "::error::The description needs a line 'Closes #N' (or 'Fixes #N'; 'Part of #N' or 'Refs #N' for a step that leaves the issue open), or 'No issue: <reason>'."
            fail=1
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files" --jq '.[].filename')
          if grep -Eq '^(plugin\.json|src/)' <<<"$files"; then
            if ! grep -Eiq '!\[|<img|^no picture: .+' <<<"$body"; then
              echo "::error::This PR changes plugin.json or src/: add a screenshot to the description, or a line 'No picture: <reason>'."
              fail=1
            fi
          fi
          exit $fail
